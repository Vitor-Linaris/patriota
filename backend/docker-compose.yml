services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: patriota-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck so docker compose knows when Nest is actually
    # listening — not just when the container process exists. The web
    # service uses `condition: service_healthy` on api so server-side
    # apiFetch calls don't ECONNREFUSED during the prisma boot dance.
    # 90s start_period covers `prisma generate + migrate deploy +
    # db seed + nest start` even on a cold image.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://localhost:8585/public/categories').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 90s
    volumes:
      - ./src:/usr/src/app/src
      - ./prisma:/usr/src/app/prisma
      - ./test:/usr/src/app/test
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - ./tsconfig.test.json:/usr/src/app/tsconfig.test.json
      - ./tsconfig.build.json:/usr/src/app/tsconfig.build.json
      - ./package.json:/usr/src/app/package.json
      - ./nest-cli.json:/usr/src/app/nest-cli.json
      # Persistent storage for uploaded media (sharp output).
      # Named volume → survives docker compose down and is independent
      # of the source bind-mounts above. NEVER add :ro here.
      - uploads_data:/usr/src/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: patriota-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: patriota-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads_data:
